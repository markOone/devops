services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - tasktracker_net

  webapp:
    build: .
    depends_on:
      - db
    volumes:
      - ./config.json:/etc/mywebapp/config.json:ro
    networks:
      - tasktracker_net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - webapp
    networks:
      - tasktracker_net

networks:
  tasktracker_net:
    driver: bridge

volumes:
  db_data: